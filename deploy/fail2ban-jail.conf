# /etc/fail2ban/jail.d/volleyball.local
# 10 分鐘內管理密碼錯 5 次就封鎖該 IP 的 80/443；
# 封鎖時間、遞增規則與 ignoreip 沿用 jail.d/isirl.local 的 [DEFAULT]（1h 起跳、最長 1 週）。
[volleyball-admin]
enabled  = true
port     = http,https
filter   = volleyball-admin
logpath  = /var/log/nginx/volleyball.access.log
backend  = auto
maxretry = 5
findtime = 10m
