# POST /api 頻率限制（每個 IP）：只算 POST，讀取頁面的 GET 不受影響。
# 上限放寬到每分鐘 20 次＋突發 20 次，同校網路（同一個對外 IP）多人同時報名也不會被擋；
# 暴力猜管理密碼另外由 fail2ban 的 volleyball-admin jail 處理（連續答錯就封鎖 IP）。
map $request_method $volleyball_post_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $volleyball_post_key zone=volleyball_api_post:10m rate=20r/m;

server {
    server_name tcjhvolley.felidae.tw;
    server_tokens off;
    include snippets/isirl-security-headers.conf;

    # 獨立的 access log，給 fail2ban 判讀管理密碼錯誤（403）用
    access_log /var/log/nginx/volleyball.access.log;

    # 1. 告訴 Nginx 網頁檔案放在這裡
    root /var/www/volleyball;

    # 預設讀取的首頁檔案名稱
    index index.html;

    # 2. 當使用者直接輸入網址 (不帶 /api) 時，回傳 index.html
    location / {
        try_files $uri $uri/ =404;
    }

    # 3. 當使用者請求 /api 時，轉交給背景的 Flask 處理
    location /api {
        limit_req zone=volleyball_api_post burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5000/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tcjhvolley.felidae.tw/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tcjhvolley.felidae.tw/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    server_tokens off;

    if ($host = tcjhvolley.felidae.tw) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name tcjhvolley.felidae.tw;
    return 404; # managed by Certbot


}
