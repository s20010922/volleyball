server {
    server_name tcjhvolley.felidae.tw;

    # 1. 告訴 Nginx 網頁檔案放在這裡
    root /var/www/volleyball;
    
    # 預設讀取的首頁檔案名稱
    index index.html;

    # 2. 當使用者直接輸入網址 (不帶 /api) 時，回傳 index.html
    location / {
        try_files $uri $uri/ =404;
    }

    # 3. 當使用者請求 /api 時，轉交給背景的 Flask 處理
    location /api {
        proxy_pass http://127.0.0.1:5000/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tcjhvolley.felidae.tw/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tcjhvolley.felidae.tw/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = tcjhvolley.felidae.tw) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name tcjhvolley.felidae.tw;
    return 404; # managed by Certbot


}